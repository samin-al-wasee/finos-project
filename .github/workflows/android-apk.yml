name: Android APK

# Manual only, for now (docs/DEVELOPMENT.md §59). Runnable from any branch —
# in the Actions UI, pick the branch under "Use workflow from" before running.
#
# The version name is derived from the triggering branch so an APK's origin
# is always visible from its version alone:
#   release  -> X.Y.Z-release  (release Flutter build)
#   preview  -> X.Y.Z-preview  (release Flutter build, for external testers)
#   anything else -> X.Y.Z-debug (debug Flutter build)
#
# Builds an .aab (Play Console upload) plus per-ABI split .apks (manual/direct
# sharing outside Play — smaller than a universal APK). Release/profile builds
# are obfuscated with a separate debug-symbols archive uploaded alongside, so
# crash reports can still be de-obfuscated.
#
# Real release signing is used only when the ANDROID_KEYSTORE_BASE64 repo
# secret is configured (see android/key.properties.example for the fields
# it maps to). Until then, builds fall back to the debug key — fine for
# internal testing, not for Play Store submission.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: >-
          Override the build number (Android versionCode). Defaults to this
          workflow run's number.
        required: false
        type: string

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable

      - name: Determine version and build mode
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base_version=$(grep '^version:' pubspec.yaml | sed -E 's/version:\s*//' | cut -d'+' -f1)

          case "${GITHUB_REF_NAME}" in
            release)
              suffix=release
              build_mode=release
              ;;
            preview)
              suffix=preview
              build_mode=release
              ;;
            *)
              suffix=debug
              build_mode=debug
              ;;
          esac

          version_name="${base_version}-${suffix}"
          build_number="${{ inputs.build_number }}"
          build_number="${build_number:-${{ github.run_number }}}"

          echo "Building ${version_name} (build ${build_number}, ${build_mode} mode) from ${GITHUB_REF_NAME}"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "build_mode=${build_mode}" >> "$GITHUB_OUTPUT"

          if [ "$build_mode" = "release" ]; then
            echo "extra_flags=--obfuscate --split-debug-info=build/app/outputs/symbols" >> "$GITHUB_OUTPUT"
          else
            echo "extra_flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release signing config
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF
            echo "Using real release signing (ANDROID_KEYSTORE_BASE64 secret found)."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured — falling back to the debug key. Not suitable for Play Store."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle (Play Console upload)
        run: |
          flutter build appbundle \
            --${{ steps.version.outputs.build_mode }} \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            ${{ steps.version.outputs.extra_flags }}

      - name: Build split APKs (direct/manual distribution)
        run: |
          flutter build apk \
            --${{ steps.version.outputs.build_mode }} \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --split-per-abi \
            ${{ steps.version.outputs.extra_flags }}

      - name: Locate build outputs
        id: outputs
        shell: bash
        run: |
          set -euo pipefail
          bundle_path="build/app/outputs/bundle/${{ steps.version.outputs.build_mode }}/app-${{ steps.version.outputs.build_mode }}.aab"
          if [ ! -f "$bundle_path" ]; then
            echo "Expected app bundle not found at $bundle_path" >&2
            exit 1
          fi
          echo "bundle_path=${bundle_path}" >> "$GITHUB_OUTPUT"

          apk_dir="build/app/outputs/flutter-apk"
          if ! ls "$apk_dir"/app-*-"${{ steps.version.outputs.build_mode }}".apk >/dev/null 2>&1; then
            echo "Expected split APKs not found in $apk_dir" >&2
            exit 1
          fi
          echo "apk_dir=${apk_dir}" >> "$GITHUB_OUTPUT"

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: finos-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}-aab
          path: ${{ steps.outputs.outputs.bundle_path }}
          retention-days: 30

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: finos-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}-apks
          path: ${{ steps.outputs.outputs.apk_dir }}/app-*-${{ steps.version.outputs.build_mode }}.apk
          retention-days: 30

      - name: Upload debug symbols (obfuscation mapping)
        if: steps.version.outputs.build_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: finos-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}-symbols
          path: build/app/outputs/symbols
          retention-days: 90
